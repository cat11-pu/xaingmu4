[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orset"
version = "0.0.0"
description = "Add-wins OR-Set CRDT with commutative, associative and idempotent merge"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["orset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让裸 `pytest -q` 与 `python -m pytest` 一样能从仓库根目录导入 orset，
# 无需先 pip install -e .
pythonpath = ["."]
